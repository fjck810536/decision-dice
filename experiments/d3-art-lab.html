<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f0c">
<title>D3 Symbol Art Lab v3</title>
<style>
:root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#0d0f0c;color:#e7e8df;--line:#505747;--acid:#cdd58b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0d0f0c}body{min-height:100svh;-webkit-text-size-adjust:100%;touch-action:manipulation}main{width:min(100%,620px);margin:auto;padding:max(12px,env(safe-area-inset-top)) 12px max(20px,env(safe-area-inset-bottom));display:grid;gap:9px}.controls{border:1px solid var(--line);background:#151812;padding:9px;display:grid;gap:7px}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.row>span{width:58px;color:#8f9583;font-size:10px;letter-spacing:.13em}button{appearance:none;border:1px solid #4b5144;border-radius:0;background:#0f110d;color:#d7d9ce;font:inherit;min-height:42px;padding:0 12px;touch-action:manipulation}button.active{border-color:var(--acid);color:var(--acid)}button:disabled{opacity:.35}.stage{position:relative;aspect-ratio:1/1;width:100%;overflow:hidden;border:1px solid #626957;background:#0c0e0b}.stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}.badge,.status{position:absolute;top:8px;padding:6px 7px;border:1px solid rgba(205,213,139,.35);background:rgba(8,9,7,.78);font-size:9px;letter-spacing:.08em;pointer-events:none}.status{left:8px}.badge{right:8px}.bottom{display:grid;grid-template-columns:1.4fr 1fr;gap:7px}.roll{min-height:62px;background:var(--acid);border-color:#dbe29a;color:#10120c;font-size:18px;font-weight:900;letter-spacing:.18em}.result{border:1px solid var(--line);background:#11130f;display:grid;place-items:center;text-align:center;padding:6px}.result small{display:block;color:#8f9583;font-size:9px;letter-spacing:.12em;margin-bottom:4px}.result strong{font-size:24px}.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.legend div{border:1px solid #393f34;background:#11130f;padding:8px;text-align:center;font-size:11px}.legend strong{display:block;font-size:22px;line-height:1.2}.note{color:#8f9583;font-size:10px;line-height:1.5;margin:0 2px}.warning{color:#c9bca2}@media(max-width:420px){.bottom{grid-template-columns:1fr}.result{min-height:64px}.stage{min-height:340px}}
</style>
</head>
<body>
<main>
<section class="controls"><div class="row"><span>VIEW</span><button class="active" data-view="high">HIGH</button><button data-view="low">LOW</button><button data-view="side">SIDE</button></div></section>
<section class="stage" id="stage"><canvas id="c"></canvas><div class="status" id="status">READY</div><div class="badge">D3 SYMBOL PASS 03</div></section>
<div class="legend"><div><strong>○</strong>1 / DARK</div><div><strong style="color:#96372f">×</strong>2 / RED</div><div><strong>□</strong>3 / BODY GROOVE</div></div>
<section class="bottom"><button class="roll" id="roll">ROLL D3</button><div class="result"><div><small>RESULT</small><strong id="result">—</strong></div></div></section>
<p class="note"><span class="warning">v3：</span>× 改成舊骰紅。3 面的正方形不再畫黑色框：沒有墨色、沒有填色，方框本體保持透明，直接露出骰體顏色；只用非常淡的錯位明暗邊提示「這裡有一道凹槽」。</p>
</main>
<script type="module">
import { DiceEngine } from '../src/dice/engine.js';
import { D3ArtMarkingFactory } from './d3-art-markings.js';
import { installDoubleTapZoomGuard } from '../src/ui/mobile-gesture-guard.js';

installDoubleTapZoomGuard();
const stage=document.querySelector('#stage');
const canvas=document.querySelector('#c');
const rollButton=document.querySelector('#roll');
const resultEl=document.querySelector('#result');
const statusEl=document.querySelector('#status');
const viewButtons=[...document.querySelectorAll('[data-view]')];
let view='high';
let rolling=false;

const engine=new DiceEngine({canvas,stage,rendererOptions:{internalWidth:360,projectionMode:'perspective'}});
engine.renderer.faceMarkings.dispose();
engine.renderer.faceMarkings=new D3ArtMarkingFactory();

function setButtonState(){viewButtons.forEach(button=>button.classList.toggle('active',button.dataset.view===view));}
function applyView(){
  const r=engine.renderer;
  const camera=r.perspectiveCamera;
  if(view==='high'){
    r.setProjectionMode('perspective');
    r.setPhysicalCount(1);
  }else{
    r.setProjectionMode('perspective');
    camera.up.set(0,1,0);
    if(view==='low') camera.position.set(0,r.floorY+6.5,7.8);
    else camera.position.set(8.1,r.floorY+4.2,4.7);
    camera.lookAt(0,r.floorY+.15,0);
    camera.updateProjectionMatrix();
  }
  r.lastRenderAt=0;
  r.render(r.records,performance.now(),true);
}

viewButtons.forEach(button=>button.addEventListener('click',()=>{
  if(rolling)return;
  view=button.dataset.view;
  setButtonState();
  applyView();
  statusEl.textContent=view==='high'?'PRODUCT CAMERA':'INSPECTION VIEW';
}));

rollButton.addEventListener('click',async()=>{
  if(rolling)return;
  rolling=true;
  rollButton.disabled=true;
  resultEl.textContent='…';
  statusEl.textContent='ROLLING';
  try{
    const result=await engine.roll({pool:[{type:'d3',count:1}]});
    resultEl.textContent=String(result.dice?.[0]?.value??'—');
    statusEl.textContent='LOCKED / ART CHECK';
    applyView();
  }catch(error){
    statusEl.textContent='ERROR';
    resultEl.textContent=error?.message??String(error);
  }finally{
    rolling=false;
    rollButton.disabled=false;
  }
});

applyView();
</script>
</body>
</html>
