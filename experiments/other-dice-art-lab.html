<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f0c">
<title>Other Dice Art Lab v6</title>
<style>
:root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#0d0f0c;color:#e7e8df;--line:#505747;--acid:#cdd58b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0d0f0c}body{min-height:100svh;-webkit-text-size-adjust:100%;touch-action:manipulation}main{width:min(100%,620px);margin:auto;padding:max(12px,env(safe-area-inset-top)) 12px max(20px,env(safe-area-inset-bottom));display:grid;gap:9px}.controls{border:1px solid var(--line);background:#151812;padding:9px;display:grid;gap:7px}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.row>span{width:58px;color:#8f9583;font-size:10px;letter-spacing:.13em}button{appearance:none;border:1px solid #4b5144;border-radius:0;background:#0f110d;color:#d7d9ce;font:inherit;min-height:40px;padding:0 12px;touch-action:manipulation}button.active{border-color:var(--acid);color:var(--acid)}button:disabled{opacity:.35}.stage{position:relative;aspect-ratio:1/1;width:100%;overflow:hidden;border:1px solid #626957;background:#0c0e0b}.stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}.badge,.status{position:absolute;top:8px;padding:6px 7px;border:1px solid rgba(205,213,139,.35);background:rgba(8,9,7,.78);font-size:9px;letter-spacing:.08em;pointer-events:none}.status{left:8px}.badge{right:8px}.bottom{display:grid;grid-template-columns:1.4fr 1fr;gap:7px}.roll{min-height:62px;background:var(--acid);border-color:#dbe29a;color:#10120c;font-size:18px;font-weight:900;letter-spacing:.18em}.result{border:1px solid var(--line);background:#11130f;display:grid;place-items:center;text-align:center;padding:6px}.result small{display:block;color:#8f9583;font-size:9px;letter-spacing:.12em;margin-bottom:4px}.result strong{font-size:24px}.note{color:#8f9583;font-size:10px;line-height:1.45;margin:0 2px}.warning{color:#c9bca2}@media(max-width:420px){.bottom{grid-template-columns:1fr}.result{min-height:64px}.stage{min-height:340px}}
</style>
</head>
<body>
<main>
<section class="controls">
<div class="row"><span>DICE</span><button data-die="d4">D4</button><button data-die="d6">D6</button><button data-die="d8">D8</button><button class="active" data-die="d20">D20</button></div>
<div class="row"><span>VIEW</span><button class="active" data-view="high">HIGH</button><button data-view="low">LOW</button><button data-view="side">SIDE</button></div>
</section>
<section class="stage" id="stage"><canvas id="c"></canvas><div class="status" id="status">READY</div><div class="badge" id="badge">D20 ART PASS 01</div></section>
<section class="bottom"><button class="roll" id="roll">ROLL</button><div class="result"><div><small>RESULT</small><strong id="result">—</strong></div></div></section>
<p class="note"><span class="warning">v6：</span>D4 / D6 / D8 已鎖定。現在只做 D20：單位數維持大字，10–20 稍微收窄但仍盡量吃滿三角面；暖黑填墨＋淺凹刻亮邊，6 / 9 保留下劃線。D20 使用獨立 wrapper，不會改到前面已通過的骰子。</p>
</main>
<script type="module">
import { DiceEngine } from '../src/dice/engine.js';
import { OtherDiceArtMarkingFactory } from './other-dice-art-markings-d20.js';
import { installDoubleTapZoomGuard } from '../src/ui/mobile-gesture-guard.js';

installDoubleTapZoomGuard();

const stage=document.querySelector('#stage');
const canvas=document.querySelector('#c');
const rollButton=document.querySelector('#roll');
const resultEl=document.querySelector('#result');
const statusEl=document.querySelector('#status');
const badgeEl=document.querySelector('#badge');
const dieButtons=[...document.querySelectorAll('[data-die]')];
const viewButtons=[...document.querySelectorAll('[data-view]')];

let mode='d20';
let view='high';
let rolling=false;

const engine=new DiceEngine({canvas,stage,rendererOptions:{internalWidth:360,projectionMode:'perspective'}});
engine.renderer.faceMarkings.dispose();
engine.renderer.faceMarkings=new OtherDiceArtMarkingFactory();

function setButtonState(buttons,key,value){
  buttons.forEach(button=>button.classList.toggle('active',button.dataset[key]===value));
}

function pool(){return [{type:mode,count:1}];}

function applyView(){
  const r=engine.renderer;
  const camera=r.perspectiveCamera;
  if(view==='high'){
    r.setProjectionMode('perspective');
    r.setPhysicalCount(1);
  }else{
    r.setProjectionMode('perspective');
    camera.up.set(0,1,0);
    if(view==='low') camera.position.set(0,r.floorY+6.5,7.8);
    else camera.position.set(8.1,r.floorY+4.2,4.7);
    camera.lookAt(0,r.floorY+.15,0);
    camera.updateProjectionMatrix();
  }
  r.lastRenderAt=0;
  r.render(r.records,performance.now(),true);
}

function resultText(result){
  const die=result.dice?.[0];
  if(!die)return '—';
  return String(die.value);
}

dieButtons.forEach(button=>button.addEventListener('click',()=>{
  if(rolling)return;
  mode=button.dataset.die;
  setButtonState(dieButtons,'die',mode);
  if(mode==='d6') badgeEl.textContent='D6 LOCKED';
  else if(mode==='d4') badgeEl.textContent='D4 VERTEX READ / LOCKED';
  else if(mode==='d8') badgeEl.textContent='D8 LOCKED';
  else if(mode==='d20') badgeEl.textContent='D20 ART PASS 01';
  resultEl.textContent='—';
  statusEl.textContent='READY';
  engine.renderer.reset();
  applyView();
}));

viewButtons.forEach(button=>button.addEventListener('click',()=>{
  if(rolling)return;
  view=button.dataset.view;
  setButtonState(viewButtons,'view',view);
  applyView();
  statusEl.textContent=view==='high'?'PRODUCT CAMERA':'INSPECTION VIEW';
}));

rollButton.addEventListener('click',async()=>{
  if(rolling)return;
  rolling=true;
  rollButton.disabled=true;
  resultEl.textContent='…';
  statusEl.textContent='ROLL / 0';
  try{
    const result=await engine.roll({
      pool:pool(),
      onProgress(progress){
        if(String(progress.phase).startsWith('FEEDING')) statusEl.textContent=`FEED / ${progress.spawned} OF ${progress.physicalCount}`;
        else statusEl.textContent=`SETTLE / ${progress.frozen} OF ${progress.physicalCount}`;
      },
    });
    resultEl.textContent=resultText(result);
    statusEl.textContent='LOCKED / ART CHECK';
    applyView();
  }catch(error){
    statusEl.textContent='ERROR';
    resultEl.textContent=error?.message??String(error);
  }finally{
    rolling=false;
    rollButton.disabled=false;
  }
});

applyView();
</script>
</body>
</html>
